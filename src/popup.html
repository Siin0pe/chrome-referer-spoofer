    <title>Referer Spoofer</title>

<body>
    <div class="container">
        <header>
            <h1>Referer Spoofer</h1>
            <a href="https://github.com/Siin0pe" target="_blank" class="author-link">By @Siin0pe</a>
        </header>

        <div class="field">
            <label for="referer">Referer URL</label>
            <input type="text" id="referer" placeholder="https://example.com" />
        </div>

        <div class="option-row">
            <span class="option-text">
                External links only
                <span class="option-desc">Same-domain links keep their original referer</span>
            </span>
            <label class="toggle">
                <input type="checkbox" id="externalOnly" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="actions">
            <button id="setReferer">Set &amp; Refresh</button>
            <button id="deleteReferer">Delete</button>
        </div>
